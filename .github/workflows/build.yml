name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: cp nativ/*.java android/app/src/main/java/com/vikka/smartalarm/
      - run: python3 nativ/patch_manifest.py
      - run: npx cap sync android
      - run: mkdir -p ~/.android && cp vikka.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vikka-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
